name: Build BlenderMobile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mobile:
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ${{ (matrix.platform == 'ios') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout BlenderMobile
        uses: actions/checkout@v4
        with:
          # CRITICAL FIX: Enable Git LFS to pull the missing blend files
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Checkout LFS Objects
        # This ensures the large files are actually pulled into the workspace
        run: git lfs pull

      - name: Install Build Tools
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build python3-dev
          else
            brew install cmake ninja
          fi

      - name: Build for Android
        if: matrix.platform == 'android'
        run: |
          mkdir build_android && cd build_android
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DWITH_PYTHON=ON \
            -DWITH_GLSL=ON
          ninja

      - name: Build for iOS
        if: matrix.platform == 'ios'
        run: |
          mkdir build_ios && cd build_ios
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_PYTHON=ON \
            -DWITH_METAL=ON
          ninja

      - name: Stage Production Artifacts
        run: |
          mkdir -p staged_output
          find . -type f \( -name "*.apk" -o -name "*.ipa" -o -name "blender" -o -name "*.so" -o -name "*.a" \) -exec cp {} ../staged_output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ matrix.platform }}
          path: staged_output/

  publish-release:
    needs: build-mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blender-*
          merge-multiple: true
          path: release-assets

      - name: Create BlenderMobile Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "production"
          prerelease: false
          title: "BlenderMobile"
          files: |
            release-assets/*
