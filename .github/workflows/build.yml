name: Build BlenderMobile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mobile:
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ${{ (matrix.platform == 'ios') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout BlenderMobile
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build for Android
        if: matrix.platform == 'android'
        run: |
          # Install target and NDK helper
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          # Build Blender core for Android ARM64
          cargo ndk -t arm64-v8a build --release 2>&1 | tee build_android.log

      - name: Build for iOS
        if: matrix.platform == 'ios'
        run: |
          # Install iOS target
          rustup target add aarch64-apple-ios
          # Build Blender core for A-series/M1 hardware
          cargo build --release --target aarch64-apple-ios 2>&1 | tee build_ios.log

      - name: Stage Mobile Artifacts
        shell: bash
        run: |
          mkdir -p staged_output
          # Collect libraries and app files, excluding source code
          find target/ -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.a" -o -name "*.so" \) -exec cp {} staged_output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ matrix.platform }}
          path: staged_output/

  publish-release:
    needs: build-mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Mobile Builds
        uses: actions/download-artifact@v4
        with:
          pattern: blender-*
          merge-multiple: true
          path: release-assets

      - name: Create BlenderMobile Production Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "production"
          prerelease: false
          title: "BlenderMobile"
          # Regular title, no snippets, no .rs source code
          files: |
            release-assets/*
            !release-assets/*.log
